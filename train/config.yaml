# 8초 경로 VAE 학습 설정 파일

# Data Configuration
data:
  # 8초 경로 데이터셋 설정
  trajectory_data_path: "$HOME/99_dataset/01_nuplan/dataset/vae/trajectories_8s.npz"
  # 정규화 파라미터 경로 (없으면 데이터셋에서 자동 계산)
  trajectory_norm_params_path: "$HOME/99_dataset/01_nuplan/dataset/vae/trajectories_8s_norm_params.json"
  # 정규화 적용 여부
  normalize: true
  # 사용할 최대 샘플 수 (None이면 전체 데이터 사용)
  max_samples: 100000

# Model Configuration
model:
  # Trajectory Configuration
  future_horizon: 80  # T_future: 미래 프레임 수 (8초 * 10Hz = 80)
  future_dim: 2  # [x, y]
  
  # VAE Configuration
  latent_dim: 32  # Latent variable z의 차원 (8초 경로용: 32차원)
  kl_weight: 0.0001  # KL Divergence Loss 가중치 (일반 VAE는 보통 1.0)

# Training Configuration
training:
  batch_size: 32
  num_epochs: 500
  learning_rate: 1.5e-4
  weight_decay: 1e-5
  gradient_clip: 1.0
  # Learning Rate Scheduler 설정
  lr_scheduler:
    enabled: true
    mode: "min"  # "min": reconstruction error 감소 모니터링
    factor: 0.7  # 학습률 감소 비율
    patience: 8  # 개선이 없을 때 기다릴 epoch 수
    threshold: 1e-5  # 개선으로 간주할 최소 변화량
    min_lr: 1e-7  # 최소 학습률
    cooldown: 2  # 학습률 감소 후 대기할 epoch 수

# Logging Configuration
logging:
  log_dir: "./logs"
  save_dir: "./checkpoints"
  save_interval: 5  # 에포크마다 체크포인트 저장 간격
